; PCD/sensor transport settings (PKG-01).
; This file is read by the editor and is copied next to every package as
;   <package>\ma0t10_dt\Config\SensorTransport.ini
; Values apply at start; empty values keep the map/UI values. Quotes are optional.
; TransportMode: StompWebSocket | HttpPost | LogOnly | SaveToFile | None
; Do not commit a real Passcode; set it in the packaged copy on the target PC.
[MA0T10.SensorTransport]
TransportMode=
BrokerUrl=
ExportTopic=
LidarTopic=
CameraTopic=
AckTopic=
UserName=
Passcode=
HttpEndpoint=
